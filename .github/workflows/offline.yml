name: Offline Windows Alpha
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          architecture: x64
      - name: Verify public inventory before running the preview
        run: python -I -B -X utf8 tools/verify_public.py --strict
      - name: Assemble and verify the proposed release ZIP
        shell: pwsh
        run: python -I -B -X utf8 tools/package_snapshot.py (Join-Path $env:RUNNER_TEMP 'reviewed-archive')
      - name: Install the locked wheel in an isolated environment
        shell: pwsh
        run: |
          $venv = Join-Path $env:RUNNER_TEMP 'alpha-venv'
          python -m venv $venv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $py = Join-Path $venv 'Scripts/python.exe'
          & $py -I -m pip --isolated install --only-binary=:all: --require-hashes -r requirements.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "ALPHA_PY=$py" >> $env:GITHUB_ENV
      - name: Fetch the verified CI fonts
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'alpha-fonts'
          & $env:ALPHA_PY -I -B -X utf8 tools/ci_fonts.py $dir
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "ORIGIN_ALPHA_TEST_CONFIG=$(Join-Path $dir 'fonts.json')" >> $env:GITHUB_ENV
      - name: Run doctor, first preview and offline regressions
        shell: pwsh
        run: |
          & $env:ALPHA_PY -I -B -X utf8 .agents/skills/origin-alpha/scripts/origin_trial.py --config $env:ORIGIN_ALPHA_TEST_CONFIG doctor
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:ALPHA_PY -I -B -X utf8 tools/first_preview.py --config $env:ORIGIN_ALPHA_TEST_CONFIG --state-dir (Join-Path $env:RUNNER_TEMP 'alpha-first')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:ALPHA_PY -I -B -X utf8 -m unittest discover -s tests -v
